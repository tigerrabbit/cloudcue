name: GLib dependency safety

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb xauth dbus-x11
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --component rust-docs
          rustup default stable
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run test:security
      - name: Collect exact Linux distribution notices
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu
          python3 scripts/generate-distribution-notices.py --target x86_64-unknown-linux-gnu
          grep -F "Patched source: https://github.com/tigerrabbit/cloudcue/tree/${GITHUB_SHA}/vendor/glib-0.18.5" DISTRIBUTION-NOTICES.txt
      - name: Verify and build Linux app
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol

      - name: Install upstream native test driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - run: npm run test:e2e:native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-native-evidence
          path: .local/native-e2e
          include-hidden-files: true
          retention-days: 14
