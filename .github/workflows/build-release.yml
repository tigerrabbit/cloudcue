name: Build preview downloads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # An ad-hoc signature is not Developer ID signing or notarization.
      APPLE_SIGNING_IDENTITY: '-'
      NO_STRIP: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Require fresh package output
        run: python scripts/stage-release.py ${{ matrix.platform }} --prebuild
      - name: Build native packages from locked dependencies
        run: npx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Inspect and stage only the intended downloads
        run: python scripts/stage-release.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudcue-${{ matrix.platform }}
          path: release-assets/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
