[package]
name = "cloudcue"
license = "MIT"
description = "Offline CCSP foundation practice"
authors = ["Gregory Wendel"]
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# GTK 3 requires glib 0.18; use the reviewed upstream pointer-safety backport.
[patch.crates-io]
glib = { path = "../vendor/glib-0.18.5" }
